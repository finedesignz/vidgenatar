# Dependabot config: grouped updates on a monthly cadence.
# Goal: collapse the per-dependency PR storm into a few grouped PRs per
# month. Security updates are grouped too via applies-to: security-updates,
# since schedule and open-pull-requests-limit do not apply to them.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    groups:
      all-dependencies:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      major-updates:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "major"
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: "pip"
    directory: "/heygen-studio-template"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    groups:
      all-dependencies:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      major-updates:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "major"
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    groups:
      all-dependencies:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      major-updates:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "major"
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"
